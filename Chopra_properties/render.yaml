services:
  - type: web
    name: chopra-properties
    env: python
    buildCommand: pip install -r backend/requirements.txt uvicorn starlette
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
    disk:
      name: chopra-disk
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
